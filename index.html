<script type="module">
// ---- load three.js + official addons (import map first, CDN ESM bundles as fallback) ----

async function loadThree() {

      const THREE = await import(core);
      const mods = await Promise.all(ADDONS.map((p) => import(addon(p))));

}
const [THREE, mRB, mBGU, mRE, mEC, mRP, mUB, mOP, mOC] = await loadThree();
const { RoundedBoxGeometry } = mRB, { mergeGeometries } = mBGU, { RoomEnvironment } = mRE;

const V3 = THREE.Vector3;
const FONT = 'system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

// ================= textures =================
const TX = (() => {

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function tex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = opts.data ? THREE.NoColorSpace : THREE.SRGBColorSpace;

function speckle(g, w, h, n, r, colors, amax, size = 2) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = colors[(r() * colors.length) | 0];
    g.globalAlpha = r() * amax;
    const s = 1 + r() * size;
    g.fillRect(r() * w, r() * h, s, s);

}

// soft blotch drawn with wrap-around so the texture tiles
function blotch(g, w, h, x, y, rad, col) {
  for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {
    const cx = x + ox, cy = y + oy;
    if (cx + rad < 0 || cx - rad > w || cy + rad < 0 || cy - rad > h) continue;
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
    gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }
}

function floorTexture() {
  return tex(512, 512, (g, w, h) => {
    const r = rng(11);
    g.fillStyle = '#b7c3c6'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) blotch(g, w, h, r() * w, r() * h, 30 + r() * 90, r() < 0.5 ? 'rgba(110,125,130,0.10)' : 'rgba(235,242,244,0.12)');
    speckle(g, w, h, 9000, r, ['#8d989c', '#eef3f4', '#6f7a7f', '#d0d8db'], 0.45, 2);

  });
}
function wallTexture() {
  return tex(512, 1024, (g, w, h) => {
    const r = rng(21);
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#c6d6d8'); gr.addColorStop(0.7, '#dfe9ea'); gr.addColorStop(1, '#d4e0e1');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 4000, r, ['#aebec2', '#f4f8f9'], 0.2, 2);
    g.fillStyle = '#4a9a93'; g.fillRect(0, h * 0.70, w, h * 0.018);
    g.fillStyle = '#2f6f6b'; g.fillRect(0, h * 0.965, w, h * 0.035);
    g.fillStyle = 'rgba(80,100,105,0.22)'; g.fillRect(0, 0, 3, h);
  });
}
// colon mucosa: salmon-pink base, soft mottling and a branching vascular network (tiles in both directions)
function mucosaTexture() {
  return tex(1024, 512, (g, w, h) => {
    const r = rng(91);
    g.fillStyle = '#e8907c'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 380; i++) blotch(g, w, h, r() * w, r() * h, 18 + r() * 70, r() < 0.5 ? 'rgba(196,84,72,0.13)' : 'rgba(255,196,176,0.14)');
    g.lineCap = 'round'; g.lineJoin = 'round';
    const seg = (x0, y0, x1, y1) => {
      const xs = [0], ys = [0];
      if (Math.min(x0, x1) < 12) xs.push(w); if (Math.max(x0, x1) > w - 12) xs.push(-w);
      if (Math.min(y0, y1) < 12) ys.push(h); if (Math.max(y0, y1) > h - 12) ys.push(-h);
      for (const ox of xs) for (const oy of ys) { g.beginPath(); g.moveTo(x0 + ox, y0 + oy); g.lineTo(x1 + ox, y1 + oy); g.stroke(); }
    };
    const walk = (x, y, a, width, n, depth) => {
      for (let k = 0; k < n; k++) {
        const nx = x + Math.cos(a) * 5, ny = y + Math.sin(a) * 5;
        g.lineWidth = width; seg(x, y, nx, ny);
        x = ((nx % w) + w) % w; y = ((ny % h) + h) % h;
        a += (r() - 0.5) * 0.65; width = Math.max(0.6, width * 0.988);
        if (depth < 3 && r() < 0.06) walk(x, y, a + (r() < 0.5 ? 1 : -1) * (0.6 + r() * 0.6), width * 0.7, ((n - k) * 0.6) | 0, depth + 1);
      }
    };
    for (let i = 0; i < 30; i++) {
      g.strokeStyle = `rgba(${(140 + r() * 40) | 0},${(28 + r() * 26) | 0},${(38 + r() * 26) | 0},${0.32 + r() * 0.3})`;
      walk(r() * w, r() * h, r() * 6.28, 1.5 + r() * 2.2, (40 + r() * 70) | 0, 0);
    }
    g.strokeStyle = 'rgba(170,60,60,0.16)';
    for (let i = 0; i < 160; i++) walk(r() * w, r() * h, r() * 6.28, 0.7, (6 + r() * 12) | 0, 3);

}
function glowTexture() {
  return tex(128, 128, (g) => {
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.15, 'rgba(255,255,255,0.75)');

      const x = 64 + (r() - 0.5) * 56, y = 64 + (r() - 0.5) * 56, rad = 14 + r() * 22;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, 'rgba(255,255,255,0.2)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

}

  let frac = 1;

    g.font = `700 54px ${FONT}`;
    const tw = Math.min(500, g.measureText(text).width + 60), x0 = (512 - tw) / 2;

// AI detection box (corner brackets), tinted green by the sprite colour
function cadeTexture() {
  return tex(256, 256, (g) => {
    g.strokeStyle = '#ffffff'; g.lineWidth = 10; g.lineCap = 'square';
    const a = 20, b = 236, k = 54;
    for (const [x, y, dx, dy] of [[a, a, 1, 1], [b, a, -1, 1], [a, b, 1, -1], [b, b, -1, -1]]) {

// octagonal endoscope image mask (white = visible)
function maskTexture() {
  return tex(256, 256, (g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    const c = 0.2 * w;
    g.fillStyle = '#fff'; g.beginPath();
    g.moveTo(c, 4); g.lineTo(w - c, 4); g.lineTo(w - 4, c); g.lineTo(w - 4, h - c); g.lineTo(w - c, h - 4); g.lineTo(c, h - 4); g.lineTo(4, h - c); g.lineTo(4, c); g.closePath(); g.fill();
  }, { clamp: true, data: true });
}
function monitorSideTexture() {
  return tex(256, 512, (g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#d8e2ea'; g.font = `600 26px ${FONT}`;
    ['大腸鏡檢查', '示範病例 A', '55 歲', '', 'CO₂ 送氣', '影像強化 1', '放大 ×1.0'].forEach((s, i) => g.fillText(s, 18, 48 + i * 42));
    g.fillStyle = '#4fd1ff'; g.fillRect(18, h - 70, 120, 6);

return { rng, tex, speckle, roundRect, floorTexture, wallTexture, mucosaTexture, glowTexture, smokeTexture, labelTexture, cadeTexture, maskTexture, monitorSideTexture };
})();

// ================= util =================
const U = (() => {
const std = (color, rough = 0.6, metal = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
function add(geo, mat, parent, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = shadow;
  if (parent) parent.add(m);
  return m;
}
const boxCache = new Map();
function box(w, h, d, mat, parent, x = 0, y = 0, z = 0, shadow = true) {
  const k = `${w},${h},${d}`;
  let g = boxCache.get(k);
  if (!g) { g = new THREE.BoxGeometry(w, h, d); boxCache.set(k, g); }
  return add(g, mat, parent, x, y, z, shadow);
}
function rbox(w, h, d, rad, mat, parent, x = 0, y = 0, z = 0) {
  return add(new RoundedBoxGeometry(w, h, d, 3, rad), mat, parent, x, y, z);
}
function cyl(r, len, mat, parent, x = 0, y = 0, z = 0, axis = 'y', seg = 20, r2 = r, open = false) {
  const g = new THREE.CylinderGeometry(r2, r, len, seg, 1, open);
  if (axis === 'x') g.rotateZ(-Math.PI / 2);
  if (axis === 'z') g.rotateX(Math.PI / 2);
  return add(g, mat, parent, x, y, z);
}
function sph(r, mat, parent, x = 0, y = 0, z = 0, seg = 18) {
  return add(new THREE.SphereGeometry(r, seg, Math.max(8, seg * 0.6 | 0)), mat, parent, x, y, z);
}
const _Y = new V3(0, 1, 0);
// capsule from point a to point b
function limb(a, b, r, mat, parent) {
  const d = new V3().subVectors(b, a), len = d.length();
  const m = add(new THREE.CapsuleGeometry(r, Math.max(0.01, len), 4, 12), mat, parent);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(_Y, d.normalize());
  return m;
}
// rim-lit "x-ray" material for the patient's body and organs
function fresnelMat(color, pow = 2.2, base = 0.04, str = 1.0) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uPow: { value: pow }, uBase: { value: base }, uStr: { value: str }, uOpacity: { value: 1 } },
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform vec3 uColor; uniform float uPow, uBase, uStr, uOpacity; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), uPow); float a = clamp((uBase + f * uStr) * uOpacity, 0.0, 1.0); gl_FragColor = vec4(uColor, a); }',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const smooth = (v) => { v = clamp01(v); return v * v * (3 - 2 * v); };
const ease = (v) => { v = clamp01(v); return v * v * v * (v * (v * 6 - 15) + 10); };
// Merge static meshes under `group` by material to cut draw calls. Anything flagged userData.dyn is left alone.
function mergeStatic(group, recursive = true) {
  group.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(group.matrixWorld).invert();
  const buckets = new Map();
  const rel = new THREE.Matrix4();
  const walk = (o) => {
    for (const c of [...o.children]) {
      if (c.userData.dyn) continue;
      if (c.isMesh && !c.isInstancedMesh) {
        if (!c.visible || c.children.length) continue;
        const key = c.material.uuid + (c.castShadow ? 'c' : '') + (c.receiveShadow ? 'r' : '') + c.renderOrder;
        let b = buckets.get(key);
        if (!b) { b = { mat: c.material, cast: c.castShadow, recv: c.receiveShadow, ro: c.renderOrder, geos: [] }; buckets.set(key, b); }

    if (b.geos.some((x) => !x.index)) b.geos = b.geos.map((x) => (x.index ? x.toNonIndexed() : x));
    const keep = ['position', 'normal', 'uv'];

    const g = b.geos.length > 1 ? mergeGeometries(b.geos, false) : b.geos[0];

})();
const { std, add, box, rbox, cyl, sph, limb, fresnelMat, clamp01, smooth, ease, mergeStatic } = U;

// ================= anatomy: colon centreline (patient frame: x = patient's left, y = head, z = front; 1 unit = 10 cm) =================
const A = (() => {
const PTS = [
  [0.00, -2.10, -0.30], [0.00, -1.85, -0.52], [0.02, -1.45, -0.74], [0.06, -1.05, -0.72], [0.15, -0.80, -0.48],          // 0-4 anus, rectum
  [-0.15, -0.70, -0.10], [-0.45, -0.52, 0.22], [-0.32, -0.22, 0.42], [0.15, -0.18, 0.40], [0.55, -0.42, 0.24], [0.92, -0.70, 0.02], // 5-10 sigmoid loop
  [1.15, -0.45, -0.24], [1.20, 0.10, -0.34], [1.18, 0.70, -0.38],                                                         // 11-13 descending
  [1.10, 1.22, -0.32], [0.88, 1.44, -0.08],                                                                               // 14-15 splenic flexure

{

// vital-sign monitor drawn on a canvas each frame
function makeVitals() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 320;
  const g = c.getContext('2d');
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const ecg = (p) => { p -= Math.floor(p); const e = (c0, w) => Math.exp(-(((p - c0) / w) ** 2)); return 0.12 * e(0.12, 0.035) - 0.12 * e(0.29, 0.012) + 1.0 * e(0.31, 0.011) - 0.28 * e(0.335, 0.012) + 0.26 * e(0.56, 0.06); };
  const pleth = (p) => { p -= Math.floor(p); return Math.exp(-(((p - 0.25) / 0.09) ** 2)) + 0.35 * Math.exp(-(((p - 0.5) / 0.08) ** 2)); };
  const resp = (p) => 0.5 + 0.5 * Math.sin(p * Math.PI * 2);
  const W = 320;
  function trace(fn, col, y0, amp, phase) {
    g.strokeStyle = col; g.lineWidth = 3; g.beginPath();
    for (let x = 0; x <= W; x += 2) { const v = fn(phase - (W - x) / 105); if (x === 0) g.moveTo(12 + x, y0 - v * amp); else g.lineTo(12 + x, y0 - v * amp); }
    g.stroke();
  }
  return {
    tex: t,
    draw(time, hr, spo2, bp, rr) {
      g.fillStyle = '#02070a'; g.fillRect(0, 0, 512, 320);
      g.strokeStyle = 'rgba(40,90,100,0.3)'; g.lineWidth = 1;
      for (let x = 12; x < 340; x += 26) { g.beginPath(); g.moveTo(x, 10); g.lineTo(x, 310); g.stroke(); }
      trace(ecg, '#46ff7a', 100, 70, time * hr / 60);
      trace(pleth, '#38d8ff', 200, 48, time * hr / 60 - 0.2);
      trace(resp, '#ffd84a', 292, 34, time * rr / 60);
      g.fillStyle = '#46ff7a'; g.font = `600 22px ${FONT}`; g.fillText('心跳', 352, 34);
      g.font = `700 64px ${FONT}`; g.fillText(String(Math.round(hr)), 352, 96);
      g.fillStyle = '#38d8ff'; g.font = `600 22px ${FONT}`; g.fillText('血氧 %', 352, 136);
      g.font = `700 52px ${FONT}`; g.fillText(String(spo2), 352, 190);
      g.fillStyle = '#ffffff'; g.font = `600 20px ${FONT}`; g.fillText('血壓', 352, 226);
      g.font = `700 30px ${FONT}`; g.fillText(bp, 352, 260);
      g.fillStyle = '#ffd84a'; g.font = `600 20px ${FONT}`; g.fillText('呼吸 ' + Math.round(rr), 352, 298);
      t.needsUpdate = true;
    },
  };
}

const SPEEDS = [1, 0.5, 0.25, 2];

function jumpStep(i) { i = ((i % 10) + 10) % 10; simT = Math.floor(simT / T) * T + TL.STEPS[i].t0 + 0.02; syncUI(); }
const curStep = () => TL.stepAt(((simT % T) + T) % T);

// ---------- UI ----------
const css = document.createElement('style');
css.textContent = `
#ui,#cap,#sub{font:500 13px/1 ${FONT};user-select:none;z-index:5;
  background:rgba(12,17,24,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#cfd8e2}
#dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;width:max-content;max-width:96vw}
#ui{display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:14px}
#ui .row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center}
#ui .row span{padding:0 4px 0 8px;color:#8f9bab;font-size:12px}
#cap{position:fixed;left:14px;top:14px;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;max-width:min(400px,44vw);line-height:1.25;font-size:12.5px}
#cap b{font-weight:600;color:#8f9bab;white-space:nowrap}
#cap .done{color:#5f7d6a}
#cap .now{color:#ff9d8a}
#cap .nowt{color:#fff}
#cap h4{grid-column:1/3;margin:0 0 2px;font-size:13px;color:#fff;font-weight:700;letter-spacing:.04em}
#sub{border-radius:12px;padding:12px 20px;font-size:18px;line-height:1.45;color:#fff;text-align:center;max-width:min(860px,92vw)}
#sub small{display:block;font-size:12.5px;color:#ff9d8a;margin-bottom:4px;letter-spacing:.08em}
.hide{display:none!important}
#ui button{all:unset;cursor:pointer;padding:7px 10px;min-width:8px;text-align:center;border-radius:9px;color:#cfd8e2;white-space:nowrap;transition:background .15s,color .15s}
#ui button:hover{background:rgba(255,255,255,.1)}
#ui button:focus-visible{outline:2px solid #5ad;outline-offset:1px}
#ui button.on{background:#ff8a72;color:#1a0d0a}
#ui button.rec{background:#d92d2d;color:#fff}
#ui i{width:1px;align-self:stretch;background:rgba(255,255,255,.16);margin:4px 3px}
`;
document.head.appendChild(css);
const ui = document.createElement('div'); ui.id = 'ui';
let row = null;
const newRow = (label) => { row = document.createElement('div'); row.className = 'row'; ui.appendChild(row); if (label) { const s = document.createElement('span'); s.textContent = label; row.appendChild(s); } };
const sep = () => row.appendChild(document.createElement('i'));
const mk = (fn, text, title) => { const b = document.createElement('button'); b.type = 'button'; b.addEventListener('click', fn); if (text) b.textContent = text; if (title) b.title = title; row.appendChild(b); return b; };
newRow('視角');
const bModes = MODES.map(([m, n]) => mk(() => setMode(m), n));
newRow('步驟');
mk(() => jumpStep(curStep() - 1), '⏮', '上一步');
const bSteps = TL.STEPS.map((s, i) => mk(() => jumpStep(i), String(i + 1), s.title));
mk(() => jumpStep(curStep() + 1), '⏭', '下一步');
newRow('播放');
const bSpeeds = SPEEDS.map((v) => mk(() => setSpeed(v), v + '×'));
sep();
const bPause = mk(() => setPaused(!paused));
const bRec = mk(() => toggleRec());
sep();
const bLbl = mk(() => { patient.show.labels = !patient.show.labels; syncUI(); }, '腸段標籤');
const bAI = mk(() => { patient.show.ai = !patient.show.ai; hudKey = ''; syncUI(); }, 'AI 偵測框');
const bBody = mk(() => { patient.show.body = !patient.show.body; syncUI(); }, '人體輪廓');
const cap = document.createElement('div'); cap.id = 'cap';
const capH = document.createElement('h4'); capH.textContent = '大腸鏡檢查流程'; cap.appendChild(capH);
const capRows = TL.STEPS.map(() => { const b = document.createElement('b'), s = document.createElement('span'); cap.append(b, s); return [b, s]; });
const sub = document.createElement('div'); sub.id = 'sub';
const subT = document.createElement('small'), subX = document.createElement('div'); sub.append(subT, subX);
const dock = document.createElement('div'); dock.id = 'dock'; dock.append(sub, ui);
document.body.append(cap, dock);
const overlays = [ui, cap, sub];
let uiHidden = q.get('ui') === '0';
if (uiHidden) overlays.forEach((e) => e.classList.add('hide'));

function liveText(i, tc) {
  const I = patient.info;
  if (i === 0) return `清腸進度 ${Math.round(clamp01(tc / 8) * 100)}%`;
  if (i === 1) return tc < 11.5 ? '接上監視器與點滴' : tc < 13.5 ? '靜脈給予鎮靜藥物' : '轉為左側躺';
  if (i >= 2 && i <= 6) return I.inside ? `插入 ${Math.round(I.depth)} cm · ${I.seg}` : '潤滑、準備插入';
  if (i === 7) { const m = clamp01((tc - 54) / 14) * 6, mm = Math.floor(m), ss = Math.floor((m - mm) * 60); return `退鏡觀察 ${mm}:${String(ss).padStart(2, '0')}（模擬）· ${I.seg}`; }
  if (i === 8) return TL.polyPhase(tc);
  return I.inside ? `退鏡中 ${Math.round(I.depth)} cm · ${I.seg}` : tc < 92.5 ? '退出內視鏡' : '恢復室休息';
}
let capLast = '';
function updateCaptions(tc) {
  const cur = TL.stepAt(tc);
  const texts = TL.STEPS.map((s, i) => (i < cur ? '✓ 完成' : i === cur ? liveText(i, tc) : s.short));
  const line = TL.lineAt(cur, tc);
  const key = cur + '#' + texts.join('|') + line;
  if (key === capLast) return; capLast = key;
  TL.STEPS.forEach((s, i) => {
    capRows[i][0].textContent = `${i + 1} ${s.title}`; capRows[i][1].textContent = texts[i];
    capRows[i][0].className = i < cur ? 'done' : i === cur ? 'now' : '';
    capRows[i][1].className = i < cur ? 'done' : i === cur ? 'nowt' : '';
  });
  subT.textContent = `第 ${cur + 1} 步 · ${TL.STEPS[cur].title}`;
  subX.textContent = line;
  bSteps.forEach((b, i) => b.classList.toggle('on', i === cur));
}

// ---------- layout of the endoscope picture ----------
let pipS = 300;
function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  ovCam.left = 0; ovCam.right = W; ovCam.top = H; ovCam.bottom = 0; ovCam.updateProjectionMatrix();
  backdrop.position.set(W / 2, H / 2, 0); backdrop.scale.set(W, H, 1);
  let S, cx, cy;
  const dh = uiHidden ? 0 : dock.offsetHeight + 14;
  if (mode === 'scope') { S = Math.max(200, Math.min(H - dh - 28, W * 0.92)); cx = W / 2; cy = H - 14 - S / 2; }
  else { S = Math.max(150, Math.min(H * 0.36, W * 0.3, 380)); cx = W - 14 - S / 2; cy = H - 14 - S / 2; }
  pipS = S;
  pip.position.set(cx, cy, 0); pip.scale.set(S, S, 1);
  hud.position.set(cx, cy, 0); hud.scale.set(S, S, 1);
  backdrop.visible = mode === 'scope';
  cap.classList.toggle('hide', uiHidden || mode === 'scope');
}

// ---------- video recording (MP4 where the browser supports it, otherwise WebM) ----------
let rec = null, recChunks = [], recStart = 0, recTimer = 0;
const REC_MAX = 100;
function pickMime() {
  const c = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return c.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
function toggleRec() {
  if (rec) { rec.stop(); return; }
  const mime = pickMime();
  if (!mime) { bRec.textContent = '此瀏覽器不支援錄影'; return; }
  const stream = renderer.domElement.captureStream(60);
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 });
  recChunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
  rec.onstop = () => {
    clearInterval(recTimer);
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(new Blob(recChunks, { type: mime.split(';')[0] }));
    const a = document.createElement('a'); a.href = url; a.download = `colonoscopy.${ext}`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
    rec = null; syncUI();
  };
  rec.start(500); recStart = performance.now();
  recTimer = setInterval(() => { if ((performance.now() - recStart) / 1000 >= REC_MAX) rec.stop(); else syncUI(); }, 500);
  syncUI();
}
function syncUI() {
  bRec.textContent = rec ? `■ 停止並下載 ${Math.floor((performance.now() - recStart) / 1000)}s` : '⏺ 錄製影片';
  bRec.classList.toggle('rec', !!rec); bRec.title = `錄製畫面並下載影片（最長 ${REC_MAX} 秒，可錄完整一輪）`;
  bPause.textContent = paused ? '▶ 播放' : '⏸ 暫停'; bPause.classList.toggle('on', paused);
  bModes.forEach((b, i) => b.classList.toggle('on', MODES[i][0] === mode));
  bModes[3].title = '用滑鼠拖曳旋轉、滾輪縮放';
  bSpeeds.forEach((b, i) => b.classList.toggle('on', SPEEDS[i] === speed));
  bLbl.classList.toggle('on', patient.show.labels); bAI.classList.toggle('on', patient.show.ai); bBody.classList.toggle('on', patient.show.body);
}
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
  else if (e.key === 'o' || e.key === 'O') setMode('orbit');
  else if (e.key === 'c' || e.key === 'C') setMode('colon');
  else if (e.key === 'e' || e.key === 'E') setMode('scope');
  else if (e.key === 'f' || e.key === 'F') setMode('free');
  else if (e.key === 'h' || e.key === 'H') { uiHidden = !uiHidden; overlays.forEach((el) => el.classList.toggle('hide', uiHidden)); layout(); }
  else if (e.key === 'n' || e.key === 'N') jumpStep(curStep() + 1);
  else if (e.key === 'b' || e.key === 'B') jumpStep(curStep() - 1);
  else if (e.key === '[' || e.key === ']') setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + (e.key === ']' ? 1 : 3)) % 4]);
  else if (e.key === 'r' || e.key === 'R') toggleRec();
  else if (e.key >= '0' && e.key <= '9') jumpStep(e.key === '0' ? 9 : +e.key - 1);
});

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  layout();
}
window.addEventListener('resize', resize); resize();

if (q.get('s')) jumpStep(+q.get('s') - 1);
const qm = q.get('v'); if (qm && MODES.some(([m]) => m === qm)) { setMode(qm); blend = 1; }
if (q.get('x')) setSpeed(+q.get('x'));
syncUI();
window.__time = () => simT;

// adaptive quality: step down if the machine cannot hold a smooth frame rate
let tier = 0, accT = 0, accN = 0, warm = 0;
function setTier(n) {
  tier = n;
  const sm = [4096, 2048, 1024, 1024][n];
  sun.shadow.mapSize.set(sm, sm);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  renderer.shadowMap.type = n >= 2 ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
  scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; });
  const pr = [Math.min(window.devicePixelRatio || 1, 1.5), 1, 0.8, 0.6][n];
  renderer.setPixelRatio(pr); composer.setPixelRatio(pr);
  for (const r of [composer.renderTarget1, composer.renderTarget2]) { r.samples = n === 0 ? 4 : 0; r.dispose(); }
  bloom.enabled = n < 3;
  if (n >= 2) { rtEndo.setSize(512, 512); }
  resize();
}
const q0 = parseInt(q.get('q') || '0'); if (q0) setTier(q0);

const BLACK = new THREE.Color(0x000000);
// keep the 3D text on the patient: hide any label whose footprint on screen falls on a staff member
const ray = new THREE.Raycaster(); ray.layers.set(5);
const _cr = new V3(), _cu = new V3(), _lp = new V3(), _pt = new V3(), _dir = new V3();
let occN = 0;
function labelsOffStaff(real) {
  camera.updateMatrixWorld();
  _cr.setFromMatrixColumn(camera.matrixWorld, 0); _cu.setFromMatrixColumn(camera.matrixWorld, 1);
  const check = (occN++ % 2) === 0;
  for (const l of patient.allLabels) {
    if (!l.visible) { l.userData.fade = 0; continue; }
    if (check) {
      l.getWorldPosition(_lp);
      const ws = new V3(); l.getWorldScale(ws);
      let hit = false;
      const fw = (l.material.map.userData.frac || 1) * ws.x * 1.08, fh = ws.y * 0.8;
      for (const [a, b] of [[0, 0], [-0.5, -0.5], [0.5, -0.5], [-0.5, 0.5], [0.5, 0.5], [-0.5, 0], [0.5, 0]]) {
        _pt.copy(_lp).addScaledVector(_cr, a * fw).addScaledVector(_cu, b * fh);
        _dir.subVectors(_pt, camera.position).normalize();
        ray.set(camera.position, _dir);
        if (ray.intersectObject(room.staffProxy, true).length) { hit = true; break; }
      }
      l.userData.hit = hit;
    }
    const goal = l.userData.hit ? 0 : 1;
    l.userData.fade += (goal - l.userData.fade) * Math.min(1, (real || 0.016) * 10);
    l.material.opacity *= l.userData.fade;
    if (l.userData.fade < 0.02) l.visible = false;
  }
}
function step(dt, real) {
  simT += dt;
  const tc = ((simT % T) + T) % T;
  patient.update(tc, simT);
  room.update(tc, simT, patient.info);
  drawHUD(tc);
  updateCaptions(tc);
  if (mode === 'free') { controls.update(); lookNow.copy(controls.target); labelsOffStaff(real); return; }
  if (mode === 'orbit') { orbT += real; orbitPose(orbT); } else colonPose(simT);
  if (blend < 1) {
    blend = Math.min(1, blend + real / 1.4);
    const e = blend * blend * (3 - 2 * blend);
    camera.position.lerpVectors(blendFrom, camGoal, e); lookNow.lerpVectors(lookFrom, look, e);
  } else { camera.position.copy(camGoal); lookNow.copy(look); }
  camera.lookAt(lookNow);
  labelsOffStaff(real);
}
function render() {
  renderer.setRenderTarget(rtEndo);
  if (patient.info.inside) {
    const bg = scene.background, fog = scene.fog;
    scene.background = BLACK; scene.fog = null;
    renderer.render(scene, patient.endoCam);
    scene.background = bg; scene.fog = fog;
  } else renderer.clear();
  renderer.setRenderTarget(null);
  composer.render();
  renderer.autoClear = false; renderer.render(ovScene, ovCam); renderer.autoClear = true;
}
function frame(now) {
  const raw = (now - last) / 1000;
  const real = Math.min(0.05, Math.max(0, raw)); last = now;
  if (++warm > 30 && tier < 3 && raw < 1) {
    accT += raw; accN++;
    if (accN >= 45) { if (accT / accN > 1 / 27) { setTier(tier + 1); warm = 0; } accT = 0; accN = 0; }
  }
  step(paused ? 0 : real * speed, paused && mode === 'orbit' ? 0 : real);
  render();
  requestAnimationFrame(frame);
}
// offline frame capture hook (used to render video files frame by frame)
if (q.get('cap')) {
  overlays.forEach((el) => el.classList.add('hide'));
  window.__step = (dt) => { step(dt, dt); render(); return renderer.domElement.toDataURL('image/jpeg', 0.92); };
  window.__seek = (t) => { simT = t; };
  step(0, 0); render();
} else requestAnimationFrame(frame);
</script>
